  async restore(d){
    if (!isSup()){ toast('الاستعادة للمشرف فقط.', true); return; }
    const doc = (S.data[d.coll] || []).find(x => x.id === d.id); if (!doc) return;
    const ok = await guarded(async () => {
      await patchDoc(d.coll, d.id, {archived:false, archivedAt:0});
      const kind = {records:'maint_restore', issues:'issue_restore', buses:'bus_restore', tasks:'task_add', members:'member_edit'}[d.coll];
      await logAct(kind, {busId: doc.busId || (d.coll === 'buses' ? doc.id : undefined), refId: doc.id, title: doc.title || doc.name || '', type: doc.type});
    });
    if (ok) toast('تمت الاستعادة.');
  },
  async 'clear-demo'(){
    if (!isSup()) return;
    const ok = await confirmBox('حذف البيانات التجريبية؟', 'بنحذف الباصات والعمليات والمشاكل والمهام التجريبية نهائيًا. أسماء الفريق تبقى، وأي شي سجلتوه أنتم ما يتأثر.', 'حذف التجريبي', true);
    if (!ok) return;
    const done = await guarded(async () => {
      for (const k of ['activity','records','issues','tasks','buses']){
        for (const x of S.data[k].filter(y => y.demo)){ await delDoc(k, x.id); }
      }
    });
    if (done) toast('انحذفت البيانات التجريبية. ابدأ بإضافة باصاتكم.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const fn = ACTIONS[act];
  if (!fn) return;
  if (el.tagName === 'A' && act === 'close-go'){ closeAllModals(); return; }
  if (el.type === 'checkbox'){ e.preventDefault(); }
  else if (el.tagName !== 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(form, form.closest('.modal') || form);
});
// live search fields in views
let inputT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.input){
    const path = el.dataset.input.split('.');
    if (path.length === 1) S.ui[path[0]] = el.value; else S.ui[path[0]][path[1]] = el.value;
    clearTimeout(inputT); inputT = setTimeout(render, 140);
  }
  if (el.classList && el.classList.contains('bad')){ el.classList.remove('bad'); const er = el.closest('.fld') && el.closest('.fld').querySelector('.err'); if (er) er.remove(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.filter){
    const [a, b] = el.dataset.filter.split('.');
    S.ui[a][b] = el.value; render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length){ e.preventDefault(); closeModal(); }
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modalStack.length)){
    if (!$('#shell').hidden){ e.preventDefault(); openSearch(); }
  }
});
window.addEventListener('hashchange', () => { closeAllModals(); render(); });
// refresh relative times every minute
setInterval(() => { if (!modalStack.length && !document.hidden) render(); }, 60000);

/* =========================================================
   Boot
   ========================================================= */
function showGate(html){
  $('#boot').hidden = true; $('#shell').hidden = true;
  const el = $('#login'); el.hidden = false; el.className = 'login';
  el.innerHTML = `<div class="login-inner"><div class="login-brand"><span class="emoji" aria-hidden="true">🚍</span><h1>مِرْكاب</h1><p class="tag">خلّ الباصات علينا.</p><div class="road" aria-hidden="true"></div></div>${html}</div><p class="login-foot">مِرْكاب — كل باص، وكل تفاصيله، في مكان واحد.</p>`;
}
function showTeamGate(){
  showGate(`<h2>رمز الفريق</h2>
    <form class="panel box" data-form="team" style="display:grid;gap:12px" novalidate>
      <div class="fld"><label for="tm-code">اكتب رمز الفريق اللي وصلك</label><input class="inp ltr" id="tm-code" name="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mk-xxxxxxxxx" required></div>
      <button class="btn primary" type="submit">دخول</button>
    </form>
    <p class="small muted" style="margin-top:14px">أسهل طريقة: افتح «رابط الدعوة» اللي أرسله لك المشرف، ويدخلك على طول.</p>
    <p class="small muted" style="margin-top:6px">أول مرة تبدأ مِرْكاب لفريقك؟ <button type="button" class="link" data-act="new-team">أنشئ فريق جديد</button></p>`);
}
(async function boot(){
  const t0 = Date.now();
  await initStore();
  if (S.mode === 'nocfg'){ showGate('<div class="panel box"><b>مِرْكاب يحتاج ربط بقاعدة البيانات.</b><p class="small muted" style="margin-top:6px">ملف الإعداد ناقص. تواصل مع اللي جهّز الموقع.</p></div>'); return; }
  if (S.mode === 'noteam'){ showTeamGate(); return; }
  const sess = lsGet(LS_ME, null);
  let meId = sess && typeof sess === 'object' ? sess.id : sess;
  S.meH = sess && typeof sess === 'object' ? sess.h : null;
  if (S.mode === 'db' && S.uid){
    try { const p = await db.doc('data/users/' + S.uid + '/profile').get(); if (p.exists && p.data().memberId) meId = p.data().memberId; } catch(e){}
  }
  S.me = meId;
  const wait = Math.max(0, 700 - (Date.now() - t0));
  setTimeout(() => { S.booted = true; dataVer++; render(); }, wait);
})();
})();
</script>
